<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem("starstream-theme") === "light" ? "light" : "dark"; }
      catch { document.documentElement.dataset.theme = "dark"; }
    </script>
    <style>html { background: #090f1a; color: #f5f5f6; color-scheme: dark; } html[data-theme="light"] { background: #f3f6fa; color: #17263b; color-scheme: light; }</style>
    <link rel="icon" type="image/svg+xml" href="/star-stream-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Stream IPTV</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
