# /etc/nginx/sites-available/starstream-mgmt.conf
# Management API (Admin) — Port 8100
#
# Assumptions:
#   - PHP app is a front-controller in /var/www/starstream-mgmt/public/index.php
#   - PHP-FPM is running (socket path may differ; see notes below)
#
# Enable:
#   ln -s /etc/nginx/sites-available/starstream-mgmt.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

# (Optional) Basic request rate limiting for admin API
limit_req_zone $binary_remote_addr zone=mgmt_req:10m rate=10r/s;

server {
    listen 8100;
    listen [::]:8100;

    server_name _;

    # IMPORTANT: Management should ideally bind to mgmt interface only.
    # If this is exposed publicly, restrict by IP.
    #
    # Example allowlist (uncomment + adjust):
    # allow 127.0.0.1;
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # deny all;

    root /opt/starstream/api-mgmt/public;
    index index.php;

    # Logs
    access_log /var/log/nginx/starstream-mgmt.access.log;
    error_log  /var/log/nginx/starstream-mgmt.error.log;

    # Tighten behavior
    charset utf-8;
    client_max_body_size 10m;

    # Security headers (fine for JSON APIs too)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Default: only serve real files or route to index.php
    location / {
        # rate limit (optional)
        limit_req zone=mgmt_req burst=30 nodelay;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # Block access to hidden files and sensitive paths
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* (?:composer\.(json|lock)|package\.json|yarn\.lock|pnpm-lock\.yaml|\.env|\.git) {
        deny all;
    }

    # PHP handling
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;

        # Debian typical sockets (choose ONE that matches your system):
        # fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        # fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_pass unix:/run/php/php-fpm.sock;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Hardening
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location /assets/channels/ {
        alias /opt/starstream/assets/channels/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }


    # Optional: cache-bust for static assets (if you have any)
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
